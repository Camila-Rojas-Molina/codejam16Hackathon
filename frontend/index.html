<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EBD5" />
    <!-- Day/Night before first paint (no flash). Mirrors src/lib/theme.ts: same key, same colours. -->
    <script>
      ;(function () {
        var p = null
        try {
          p = localStorage.getItem('migo:theme')
        } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var t = dark ? 'dark' : 'light'
        var root = document.documentElement
        root.setAttribute('data-theme', t)
        root.style.colorScheme = t
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#132428' : '#f3ebd5')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Montserrat+Alternates:wght@400;500;600;700;800&family=Montserrat:wght@500;600;800;900&display=swap"
    />
    <title>MIGO</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
